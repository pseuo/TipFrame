name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify version files
        shell: bash
        run: |
          npm run check:version
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "v$PACKAGE_VERSION" = "$GITHUB_REF_NAME"
      - name: Build release archive
        run: zip -r "tipframe-${GITHUB_REF_NAME}.zip" . -x '.git/*' 'node_modules/*'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "tipframe-${GITHUB_REF_NAME}.zip" --generate-notes --title "TipFrame $GITHUB_REF_NAME"
