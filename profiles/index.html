<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TipFrame 的固定项目支持页面。">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TipFrame Profiles">
  <meta property="og:description" content="TipFrame 的固定项目支持页面。">
  <meta property="og:image" content="../images/like.svg">
  <meta name="twitter:card" content="summary">
  <title>TipFrame Profiles</title>
  <link rel="icon" href="../images/like.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../fonts.css">
  <style>
    :root { color-scheme: light dark; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: clamp(24px, 6vw, 72px) 20px; background: #f6f7fb; }
    main { width: min(100%, 960px); margin: 0 auto; }
    .eyebrow { margin: 0 0 12px; color: #667085; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 640px; margin: 0; font-size: clamp(34px, 7vw, 68px); line-height: .98; letter-spacing: -.055em; }
    .intro { max-width: 560px; margin: 24px 0 40px; color: #667085; font-size: 18px; line-height: 1.6; }
    .profiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .profile-card { display: flex; min-height: 196px; flex-direction: column; justify-content: space-between; padding: 24px; border: 1px solid #dfe3ec; border-radius: 24px; background: rgba(255, 255, 255, .78); color: inherit; text-decoration: none; box-shadow: 0 12px 32px rgba(23, 32, 51, .06); transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
    .profile-card:hover, .profile-card:focus-visible { border-color: #6675f5; box-shadow: 0 18px 40px rgba(23, 32, 51, .12); transform: translateY(-2px); }
    .profile-card:focus-visible { outline: 3px solid rgba(102, 117, 245, .35); outline-offset: 3px; }
    .profile-card__name { margin: 0; font-size: 24px; letter-spacing: -.03em; }
    .profile-card__description { margin: 10px 0 0; color: #667085; line-height: 1.55; }
    .profile-card__link { align-self: flex-start; margin-top: 24px; color: #4e5bea; font-size: 14px; font-weight: 700; }
    footer { margin-top: 40px; color: #667085; font-size: 13px; }
    footer a { color: inherit; }
    @media (max-width: 640px) { .profiles { grid-template-columns: 1fr; } .profile-card { min-height: 172px; } }
    @media (prefers-color-scheme: dark) { :root, body { color: #f5f7ff; background: #111827; } .eyebrow, .intro, .profile-card__description, footer { color: #aab4c8; } .profile-card { border-color: #2c3850; background: rgba(25, 35, 54, .82); box-shadow: none; } .profile-card:hover, .profile-card:focus-visible { border-color: #9aa5ff; } .profile-card__link { color: #aab4ff; } }
    @media (prefers-reduced-motion: reduce) { .profile-card { transition: none; } .profile-card:hover, .profile-card:focus-visible { transform: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">TipFrame / Profiles</p>
    <h1>选择一个支持页面</h1>
    <p class="intro">每个 profile 都是一个稳定的静态地址，使用同一套 TipFrame 支付组件，并保留可被搜索引擎直接读取的页面信息。</p>
    <nav class="profiles" aria-label="支持页面">
      <a class="profile-card" href="./projectA/"><div><h2 class="profile-card__name">Project A</h2><p class="profile-card__description">感谢你支持 Project A 的持续维护。</p></div><span class="profile-card__link">打开支持页面 ↗</span></a>
      <a class="profile-card" href="./projectB/"><div><h2 class="profile-card__name">Project B</h2><p class="profile-card__description">Thanks for supporting Project B.</p></div><span class="profile-card__link">Open support page ↗</span></a>
    </nav>
    <footer>需要新增页面？请先在 <a href="../config.js">config.js</a> 中配置 profile，再按 <a href="./README.md">说明</a> 添加固定入口。</footer>
  </main>
</body>
</html>
